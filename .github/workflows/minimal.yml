name: Minimal GPU EC2 runner test
on:
  workflow_dispatch:
permissions:
  id-token: write  # Required for AWS OIDC authentication
  contents: read   # Required for actions/checkout
jobs:
  ec2:
    uses: Open-Athena/ec2-gha/.github/workflows/runner.yml@rw/hooks
    secrets: inherit
    with:
      action_ref: rw/hooks  # Match the ref we're using to call the workflow
  gpu-test:
    needs: ec2
    runs-on: ${{ needs.ec2.outputs.instance }}
    steps:
    - run: nvidia-smi  # g4dn.xlarge!
