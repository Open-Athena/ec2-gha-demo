name: Multi-Job GPU Instance Test
# Demonstrates multiple jobs running sequentially on the same GPU instance
# The instance only terminates after ALL jobs complete
on:
  workflow_dispatch:
    inputs:
      sleep_s:
        description: "Sleep this many seconds at the end of the `prepare`, `train`, and `eval` jobs (optional, for SSH access and debugging)"
        required: false
        type: number
        default: 0
permissions:
  id-token: write
  contents: read
jobs:
  ec2:
    uses: Open-Athena/ec2/.github/workflows/runner.yml@dev
    secrets: inherit
  prepare:
    needs: ec2
    runs-on: ${{ needs.ec2.outputs.instance }}
    outputs:
      gpu-uuid: ${{ steps.gpu-info.outputs.uuid }}
    steps:
      - name: Get GPU info
        id: gpu-info
        run: |
          echo "=== Preparing GPU environment ==="
          nvidia-smi
          uuid=$(nvidia-smi --query-gpu=gpu_uuid --format=csv,noheader)
          echo "uuid=$uuid" >> $GITHUB_OUTPUT
          echo "GPU UUID: $uuid"
      - name: Sleep (${{ inputs.sleep_s }}s)
        if: ${{ inputs.sleep_s > 0 }}
        run: sleep ${{ inputs.sleep_s }}
  train:
    needs: prepare
    runs-on: ${{ needs.ec2.outputs.instance }}
    steps:
      - name: Verify same GPU
        run: |
          echo "=== Training model on GPU ==="
          current_uuid=$(nvidia-smi --query-gpu=gpu_uuid --format=csv,noheader)
          if [[ "$current_uuid" == "${{ needs.prepare-gpu.outputs.gpu-uuid }}" ]]; then
            echo "✅ Confirmed: Using same GPU as preparation job"
          else
            echo "❌ ERROR: Different GPU!"
            exit 1
          fi
      - name: Sleep (${{ inputs.sleep_s }}s)
        if: ${{ inputs.sleep_s > 0 }}
        run: sleep ${{ inputs.sleep_s }}
  eval:
    needs: train
    runs-on: ${{ needs.ec2.outputs.instance }}
    steps:
      - name: Sleep (${{ inputs.sleep_s }}s)
        if: ${{ inputs.sleep_s > 0 }}
        run: sleep ${{ inputs.sleep_s }}
